name: Publish image
# Builds and publishes ghcr.io/<owner>/lepus:<tag> when a v* tag is pushed,
# e.g. git tag v1.0 && git push citcom-vlc v1.0
"on":
  push:
    tags:
      - "v*"
  workflow_dispatch:
permissions:
  contents: read
  packages: write
jobs:
  unit-test:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Git checkout
        uses: actions/checkout@v4
      - name: Use Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
      - name: Unit Tests
        run: |
          npm install
          npm test

  publish:
    name: Build and push to GHCR
    runs-on: ubuntu-latest
    needs: unit-test
    steps:
      - name: Git checkout
        uses: actions/checkout@v4
      - name: Image name
        id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/lepus" >> "$GITHUB_OUTPUT"
      - name: Image tags and labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=ref,event=tag
            type=sha
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # org.opencontainers.image.source links the package to this repo
          build-args: |
            GITHUB_ACCOUNT=${{ github.repository_owner }}
            GITHUB_REPOSITORY=${{ github.event.repository.name }}
            SOURCE_COMMIT=${{ github.sha }}
