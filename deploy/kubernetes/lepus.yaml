apiVersion: v1
kind: ConfigMap
metadata:
  name: lepus-config
  namespace: provider
data:
  DEBUG: "adapter:*"
  AUTH_URL: "https://auth.vlci.valencia.es:15001/v3/auth/tokens"
  NGSI_V2_CONTEXT_BROKER: "https://cb.vlci.valencia.es:10027"
  NGSI_V2_TIMEOUT: "10000"
  # Development-only workaround for the current broker certificate hostname mismatch.
  NODE_TLS_REJECT_UNAUTHORIZED: "0"
  # Prevent dotenv from loading any .env file present in the cloned repository.
  DOTENV_CONFIG_PATH: "/dev/null"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: lepus-dev
  namespace: provider
  labels:
    app: lepus-dev
spec:
  replicas: 1
  selector:
    matchLabels:
      app: lepus-dev
  template:
    metadata:
      labels:
        app: lepus-dev
    spec:
      containers:
        - name: lepus
          image: node:20
          imagePullPolicy: IfNotPresent
          command: ["/bin/sh", "-c"]
          args:
            - |
              git clone --depth 1 https://github.com/CitComAI-Hub/lepus.git /lepus &&
              cd /lepus &&
              npm install &&
              npm start
          ports:
            - name: http
              containerPort: 3000
              protocol: TCP
          readinessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
          envFrom:
            - configMapRef:
                name: lepus-config
          env:
            - name: AUTH_USER
              valueFrom:
                secretKeyRef:
                  name: lepus-auth-secret
                  key: AUTH_USER
            - name: AUTH_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: lepus-auth-secret
                  key: AUTH_PASSWORD
---
apiVersion: v1
kind: Service
metadata:
  name: lepus-dev
  namespace: provider
spec:
  selector:
    app: lepus-dev
  ports:
    - name: http
      port: 3000
      targetPort: http
      protocol: TCP
  type: ClusterIP
